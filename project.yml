name: Adalmon
options:
  bundleIdPrefix: com.example
  # Kişisel kimlikten (Config/Identity.local.xcconfig) Swift sabitlerini üretir
  preGenCommand: tools/gen-identity.sh
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: $(ADALMON_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Adalmon:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/Shared
      - Sources/WidgetShared
      - Sources/SaverShared
      - Sources/Identity
      # Ajan ofisi piksel-art görselleri: klasör olarak kopyalanır (manifest.json adları çakışmasın)
      - path: Resources/Office
        type: folder
      # Tarayıcı ofisi (index.html, app.js, style.css): klasör olarak kopyalanır; yalnızca dinleyici üzerinden, token'lı sunulur
      - path: Resources/Web
        type: folder
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Adalmon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSSystemExtensionUsageDescription: Uygulama bazlı ağ kullanımını ölçmek için.
        NSBluetoothAlwaysUsageDescription: Adalmon, bağlı aksesuarların (AirPods, klavye, fare, iPhone) pil düzeyini göstermek için Bluetooth'u kullanır.
        NSLocalNetworkUsageDescription: Adalmon, aynı Wi‑Fi ağındaki eşleşmiş iPhone ve iPad'lerin pil sağlığını okumak için yerel ağı kullanır.
        NSDownloadsFolderUsageDescription: Adalmon, İndirilenler'deki büyük ve eski dosyaları yalnızca siz 'İndirilenleri tara' dediğinizde listelemek için erişir.
        NSBonjourServices: [_apple-mobdev2._tcp]
        NSAppleEventsUsageDescription: Adalmon, yalnızca “Safari sekme listesini göster” ayarı açıkken Safari'deki açık sekmelerin başlık ve adreslerini okumak için Safari'ye erişir; Safari'de hiçbir şeyi değiştirmez.
        CFBundleURLTypes:
          - CFBundleURLName: $(ADALMON_BUNDLE_PREFIX).adalmon
            CFBundleURLSchemes: [adalmon]
    entitlements:
      path: Sources/App/Adalmon.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [content-filter-provider, app-proxy-provider]
        com.apple.security.application-groups: [$(ADALMON_TEAM_ID).$(ADALMON_BUNDLE_PREFIX).adalmon]
        com.apple.security.device.bluetooth: true
        # Hardened runtime: Safari sekme listesi (AppleScript, opt-in) için Apple olayı göndermek bu yetkiyi gerektirir.
        com.apple.security.automation.apple-events: true
    attributes:
      SystemCapabilities:
        com.apple.NetworkExtensions: {enabled: 1}
        com.apple.SystemExtensions: {enabled: 1}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ADALMON_BUNDLE_PREFIX).adalmon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS: -lsqlite3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AdalmonFilter
        embed: true
      - target: AdalmonWidgets
        embed: true
      # Ekran koruyucu (.saver): Contents/Library/Screen Savers; uygulamadaki düğme ~/Library/Screen Savers'a kopyalar
      - target: AdalmonSaver
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Screen Savers
      # libimobiledevice (LGPL-2.1+) ve bağımlılıkları: çalışma zamanında dlopen; Xcode takım kimliğiyle imzalar
      # (kitaplık doğrulaması açık kalır). Yeniden üretmek için: tools/vendor-libimobiledevice.sh
      - framework: Vendor/libimobiledevice/libimobiledevice-1.0.6.dylib
        embed: true
        codeSign: true
        link: false
      - framework: Vendor/libimobiledevice/libimobiledevice-glue-1.0.0.dylib
        embed: true
        codeSign: true
        link: false
      - framework: Vendor/libimobiledevice/libplist-2.0.12.dylib
        embed: true
        codeSign: true
        link: false
      - framework: Vendor/libimobiledevice/libusbmuxd-2.0.7.dylib
        embed: true
        codeSign: true
        link: false
      - framework: Vendor/libimobiledevice/libssl.4.dylib
        embed: true
        codeSign: true
        link: false
      - framework: Vendor/libimobiledevice/libcrypto.4.dylib
        embed: true
        codeSign: true
        link: false
  AdalmonFilter:
    type: system-extension
    platform: macOS
    sources:
      - Sources/Filter
      - Sources/Shared
      - Sources/Identity
    info:
      path: Sources/Filter/Info.plist
      properties:
        CFBundleDisplayName: AdalmonFilter
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: Ağ akışlarını sayar.
        NetworkExtension:
          NEMachServiceName: $(ADALMON_TEAM_ID).$(ADALMON_BUNDLE_PREFIX).adalmon.filter
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).TransparentProxyProvider
    entitlements:
      path: Sources/Filter/AdalmonFilter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(ADALMON_TEAM_ID).$(ADALMON_BUNDLE_PREFIX).adalmon]
        com.apple.developer.networking.networkextension: [content-filter-provider, app-proxy-provider]
    attributes:
      SystemCapabilities:
        com.apple.NetworkExtensions: {enabled: 1}
        com.apple.Sandbox: {enabled: 1}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ADALMON_BUNDLE_PREFIX).adalmon.filter
        PRODUCT_NAME: $(ADALMON_BUNDLE_PREFIX).adalmon.filter
        PRODUCT_MODULE_NAME: AdalmonFilter
  AdalmonWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Widgets
      - Sources/WidgetShared
      - Sources/Identity
    info:
      path: Sources/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Adalmon Widget'ları
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widgets/AdalmonWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(ADALMON_TEAM_ID).$(ADALMON_BUNDLE_PREFIX).adalmon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ADALMON_BUNDLE_PREFIX).adalmon.widgets
        PRODUCT_NAME: AdalmonWidgets
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        ENABLE_APP_INTENTS_METADATA_GENERATION: YES
  AdalmonSaver:
    type: bundle
    platform: macOS
    sources:
      - Sources/Saver
      - Sources/SaverShared
      - Sources/Identity
    info:
      path: Sources/Saver/Info.plist
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: Adalmon Video
        CFBundleDisplayName: Adalmon Video
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: AdalmonSaverView
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ADALMON_BUNDLE_PREFIX).adalmon.saver
        PRODUCT_NAME: AdalmonSaver
        WRAPPER_EXTENSION: saver
        MACH_O_TYPE: mh_bundle
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        # Ana süreç (legacyScreenSaver) kitaplık doğrulamasını kapatmış; yine de takım kimliğiyle imzalanır.
  AdalmonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Adalmon
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Adalmon.app/Contents/MacOS/Adalmon
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
